name: .NET CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore IAD2026.sln

      - name: Build solution
        run: dotnet build IAD2026.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test IAD2026.sln --configuration Release --no-build --verbosity normal
